name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Validate release versions and expose the tested tag and commit
        type: boolean
        default: false
    outputs:
      tag:
        description: Release tag matching the app version
        value: ${{ jobs.build.outputs.tag }}
      commit:
        description: Commit used to build the app
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read

concurrency:
  # A called workflow shares the caller's github.workflow; keep its group distinct.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test macOS
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure universal Release build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          -DBUILD_TESTING=ON
          -DSPACEWING_CODESIGN_IDENTITY=-
          -DSPACEWING_DISTRIBUTION=OFF

      - name: Build app and tests
        run: cmake --build build --parallel 3

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 60

      - name: Build and test standalone packages
        run: |
          for package in workspace switcher; do
            cmake -S "packages/$package" -B "build-$package" \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
            cmake --build "build-$package" --parallel 3
            ctest --test-dir "build-$package" --output-on-failure --no-tests=error --timeout 60
          done

      - name: Verify app signature and architectures
        run: |
          codesign --verify --deep --strict build/Spacewing.app
          lipo build/Spacewing.app/Contents/MacOS/Spacewing -verify_arch arm64 x86_64
          lipo build/Spacewing.app/Contents/Helpers/SpacewingSettings.app/Contents/MacOS/spacewing-settings \
            -verify_arch arm64 x86_64

      - name: Check release versions
        id: version
        if: inputs.release
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
            build/Spacewing.app/Contents/Info.plist)
          helper_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
            build/Spacewing.app/Contents/Helpers/SpacewingSettings.app/Contents/Info.plist)
          project_version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || \
                "$project_version" != "$app_version" || "$helper_version" != "$app_version" || \
                "$(./build/spacewing --version)" != "spacewing $app_version" ]]; then
            echo '::error::CMake, app, settings helper, and CLI versions must match.'
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo '::error::Release tag must match the app version.'
            exit 1
          fi
          echo "tag=v$app_version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Archive app bundle
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/Spacewing.app build/Spacewing-macOS-universal.zip

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Spacewing-macOS-universal
          path: build/Spacewing-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
